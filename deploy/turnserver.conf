# coturn, for relaying voice between players whose networks won't connect directly.
# The external IP, realm and user come from docker-compose.yml (see .env).
listening-port=3478
fingerprint
lt-cred-mech
# Relay ports. Open these (UDP) in the server's firewall / security group, plus 3478 TCP and UDP.
min-port=49160
max-port=49200
no-cli
no-tlsv1
no-tlsv1_1
# Never relay into private networks.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
